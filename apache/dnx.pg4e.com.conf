# Initial HTTP vhost. Use certbot --apache -d dnx.pg4e.com to enable HTTPS.
<VirtualHost *:80>
    ServerName dnx.pg4e.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/deno-pg4e-error.log
    CustomLog ${APACHE_LOG_DIR}/deno-pg4e-access.log combined
</VirtualHost>
